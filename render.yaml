services:
  - type: web
    name: himalayan-itinerary-designer
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DB_PATH
        value: "/tmp/itinerarydesigner.db"
      - key: PYTHON_VERSION
        value: "3.11.0"
